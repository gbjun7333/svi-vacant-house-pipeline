# Training settings (Section 3.4), the same for every condition and fold.
train:
  backbone: resnet50      # IMAGENET1K_V2 weights
  batch_size: 64
  epochs: 20
  lr: 0.0003              # AdamW, cosine annealing
  weight_decay: 0.0001
  num_workers: 4
  patience: 5             # early stopping on validation accuracy
  use_amp: true           # CUDA only
